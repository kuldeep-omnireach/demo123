
name: Coveo Environment Backup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to back up"
        required: true
        type: choice
        options:
          - DEV
          - QA
          - UAT
          - PRD

  schedule:
    # Every day at 4:30 AM IST
    - cron: '55 7 * * *'

permissions:
  contents: write

concurrency:
  group: coveo-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout main branch
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-repo

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 4. Install Coveo CLI
      - name: Install Coveo CLI
        run: |
          npm install -g @coveo/cli
          coveo --version

      # 5. Install Python dependencies
      - name: Install Dependencies
        working-directory: source-repo/src/scripts
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 6. Select environments
      - name: Select Backup Environments
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ENV: ${{ inputs.environment }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then

            ENVIRONMENTS="$MANUAL_ENV"

          else

            DAY=$(TZ=Asia/Kolkata date +%u)

            # PROD runs every day
            ENVIRONMENTS="PRD"

            # DEV, QA and UAT run Mon, Wed, Fri and Sun
            if [[ "$DAY" =~ ^(1|3|5|7)$ ]]; then
              ENVIRONMENTS="PRD DEV QA UAT"
            fi

          fi

          echo "environments=$ENVIRONMENTS" >> "$GITHUB_OUTPUT"
          echo "Selected environments: $ENVIRONMENTS"

      # 7. Checkout backup branch
      - name: Checkout Backup Branch
        uses: actions/checkout@v4
        with:
          ref: coveo-backups
          path: backup-repo
          persist-credentials: true

      # 8. Run backups and maintain logs
      - name: Run Environment Backups
        env:
          DEV_DEPLOYMENT_KEY: ${{ secrets.DEV_DEPLOYMENT_KEY }}
          QA_DEPLOYMENT_KEY: ${{ secrets.QA_DEPLOYMENT_KEY }}
          UAT_DEPLOYMENT_KEY: ${{ secrets.UAT_DEPLOYMENT_KEY }}
          PRD_DEPLOYMENT_KEY: ${{ secrets.PRD_DEPLOYMENT_KEY }}
          ENVIRONMENTS: ${{ steps.selection.outputs.environments }}
        run: |
          set +e

          FAILED=0

          for ENV in $ENVIRONMENTS; do

            ENV_LOWER=$(echo "$ENV" | tr '[:upper:]' '[:lower:]')

            SOURCE_DIR="source-repo/environments/$ENV_LOWER/resources"
            TARGET_DIR="backup-repo/environments/$ENV_LOWER/resources"
            LOG_FILE="environments/$ENV_LOWER/backup.logs"

            mkdir -p "backup-repo/environments/$ENV_LOWER"

            START_TIME=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST')

            STATUS="FAILED"
            DETAILS="Backup failed"

            echo "=================================="
            echo "Starting $ENV backup"
            echo "=================================="

            # Execute Python script
            (
              cd source-repo/src/scripts &&
              python3 pull_changes.py "$ENV"
            )

            SCRIPT_EXIT=$?

            if [ "$SCRIPT_EXIT" -eq 0 ]; then

              if [ -d "$SOURCE_DIR" ] &&
                 [ -n "$(find "$SOURCE_DIR" -type f -print -quit)" ]; then

                mkdir -p "$TARGET_DIR"

                # Copy latest resource files
                rsync -a --delete "$SOURCE_DIR/" "$TARGET_DIR/"
                RSYNC_EXIT=$?

                if [ "$RSYNC_EXIT" -eq 0 ]; then

                  # Stage resource changes
                  git -C backup-repo add -A \
                    "environments/$ENV_LOWER/resources/"

                  # Check whether resource files changed
                  CHANGE_LIST=$(git -C backup-repo diff \
                    --cached --name-status -- \
                    "environments/$ENV_LOWER/resources/")

                  if [ -z "$CHANGE_LIST" ]; then

                    STATUS="SUCCESS - NO CHANGES"
                    DETAILS="Coveo resources are identical to previous backup."

                  else

                    STATUS="SUCCESS - CHANGES DETECTED"
                    DETAILS="Changed files:
          $CHANGE_LIST"

                  fi

                else

                  STATUS="FAILED"
                  DETAILS="Resource synchronization failed."
                  FAILED=1

                fi

              else

                STATUS="FAILED"
                DETAILS="Backup directory missing or empty."
                FAILED=1

              fi

            else

              STATUS="FAILED"
              DETAILS="Python script failed with exit code $SCRIPT_EXIT."
              FAILED=1

            fi

            # Record execution result
            {
              echo ""
              echo "========================================"
              echo "Backup time: $START_TIME"
              echo "Environment: $ENV"
              echo "Status: $STATUS"
              echo "$DETAILS"
              echo "========================================"
            } >> "backup-repo/$LOG_FILE"

            # Stage log file
            git -C backup-repo add "$LOG_FILE"

            echo "$ENV result: $STATUS"

          done

          # Commit resource changes and logs
          cd backup-repo

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --cached --quiet; then

            git commit -m "Coveo environment backup - $(TZ=Asia/Kolkata date +'%Y-%m-%d')"
            COMMIT_EXIT=$?

            if [ "$COMMIT_EXIT" -eq 0 ]; then

              git push origin HEAD:coveo-backups
              PUSH_EXIT=$?

              if [ "$PUSH_EXIT" -ne 0 ]; then
                echo "ERROR: Failed to push backup."
                exit 1
              fi

              echo "Backup files and logs pushed successfully."

            else

              echo "ERROR: Git commit failed."
              exit 1

            fi

          else

            echo "No backup or log changes to commit."

          fi

          # Fail workflow if any environment backup failed
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more backups failed."
            exit 1
          fi

