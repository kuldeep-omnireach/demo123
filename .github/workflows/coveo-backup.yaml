
name: Coveo Daily Backup

on:
  schedule:
    # 5:00 PM IST = 11:30 AM UTC
    - cron: '30 11 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Setup Node.js for Coveo CLI
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 4: Install Coveo CLI
      - name: Install Coveo CLI
        run: |
          npm install -g @coveo/cli
          coveo --version

      # Step 5: Install Python dependencies
      - name: Install Dependencies
        working-directory: src/scripts
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Step 6: Run backup script
      - name: Run Coveo Backup
        working-directory: src/scripts
        env:
          DEV_DEPLOYMENT_KEY: ${{ secrets.DEV_DEPLOYMENT_KEY }}
        run: |
          python3 pull_changes.py DEV

      # Step 7: Commit backup files
      - name: Commit Coveo Backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking Coveo backup changes..."

          git status --short

          git add -A environments/dev/resources/

          if ! git diff --cached --quiet; then
            git commit -m "Automated Coveo DEV backup - $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes detected in Coveo DEV resources."
          fi

