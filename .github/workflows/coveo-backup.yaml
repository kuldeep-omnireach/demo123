
name: Coveo Environment Backup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Coveo environment"
        required: true
        type: choice
        options:
          - DEV
          - QA
          - UAT
          - PRD

  schedule:
    # PROD: Every day at 4:30 AM IST
    - cron: '0 23 * * *'

    # DEV, QA, UAT: Monday, Wednesday, Friday, Sunday at 4:30 AM IST
    - cron: '0 23 * * 0,2,4,6'

permissions:
  contents: write

# Prevent simultaneous pushes to the backup branch
concurrency:
  group: coveo-backup-branch
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout main branch
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-repo

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 4. Install Coveo CLI
      - name: Install Coveo CLI
        run: |
          npm install -g @coveo/cli
          coveo --version

      # 5. Install Python dependencies
      - name: Install Dependencies
        working-directory: source-repo/src/scripts
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 6. Determine environments to execute
      - name: Select Backup Environments
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_ENV: ${{ inputs.environment }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ENVIRONMENTS="$MANUAL_ENV"

          elif [ "$SCHEDULE" = "0 23 * * *" ]; then
            ENVIRONMENTS="PRD"

          elif [ "$SCHEDULE" = "0 23 * * 0,2,4,6" ]; then
            ENVIRONMENTS="DEV QA UAT"

          else
            echo "Unknown trigger"
            exit 1
          fi

          echo "environments=$ENVIRONMENTS" >> "$GITHUB_OUTPUT"

          echo "Selected environments: $ENVIRONMENTS"

      # 7. Checkout backup branch
      - name: Checkout Backup Branch
        uses: actions/checkout@v4
        with:
          ref: coveo-backups
          path: backup-repo
          persist-credentials: true

      # 8. Execute backups and update logs
      - name: Run Environment Backups
        env:
          DEV_DEPLOYMENT_KEY: ${{ secrets.DEV_DEPLOYMENT_KEY }}
          QA_DEPLOYMENT_KEY: ${{ secrets.QA_DEPLOYMENT_KEY }}
          UAT_DEPLOYMENT_KEY: ${{ secrets.UAT_DEPLOYMENT_KEY }}
          PRD_DEPLOYMENT_KEY: ${{ secrets.PRD_DEPLOYMENT_KEY }}
          ENVIRONMENTS: ${{ steps.selection.outputs.environments }}
        run: |
          set +e

          FAILED=0

          for ENV in $ENVIRONMENTS; do

            ENV_LOWER=$(echo "$ENV" | tr '[:upper:]' '[:lower:]')

            SOURCE_DIR="source-repo/environments/$ENV_LOWER/resources"
            TARGET_DIR="backup-repo/environments/$ENV_LOWER/resources"
            LOG_FILE="environments/$ENV_LOWER/backup.log"

            echo "=================================="
            echo "Starting $ENV backup"
            echo "=================================="

            mkdir -p "backup-repo/environments/$ENV_LOWER"

            START_TIME=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST')

            STATUS="FAILED"
            DETAILS="Backup execution failed"

            # Execute Python backup
            (
              cd source-repo/src/scripts &&
              python3 pull_changes.py "$ENV"
            )

            SCRIPT_EXIT=$?

            if [ "$SCRIPT_EXIT" -eq 0 ]; then

              if [ -d "$SOURCE_DIR" ] &&
                 [ -n "$(find "$SOURCE_DIR" -type f -print -quit)" ]; then

                mkdir -p "$TARGET_DIR"

                # Synchronize resource files
                rsync -a --delete "$SOURCE_DIR/" "$TARGET_DIR/"
                RSYNC_EXIT=$?

                if [ "$RSYNC_EXIT" -eq 0 ]; then

                  # Stage resource changes
                  git -C backup-repo add -A \
                    "environments/$ENV_LOWER/resources/"

                  if git -C backup-repo diff --cached --quiet -- \
                    "environments/$ENV_LOWER/resources/"; then

                    STATUS="SUCCESS - NO CHANGES"
                    DETAILS="Coveo resources are identical to previous backup."

                  else

                    STATUS="SUCCESS - CHANGES DETECTED"

                    DETAILS="Changed files:"

                    CHANGE_LIST=$(git -C backup-repo diff \
                      --cached --name-status -- \
                      "environments/$ENV_LOWER/resources/")

                    DETAILS="$DETAILS
          $CHANGE_LIST"

                  fi

                else
                  STATUS="FAILED"
                  DETAILS="Resource synchronization failed."
                  FAILED=1
                fi

              else
                STATUS="FAILED"
                DETAILS="Backup directory missing or empty."
                FAILED=1
              fi

            else
              STATUS="FAILED"
              DETAILS="Python backup script failed with exit code $SCRIPT_EXIT."
              FAILED=1
            fi

            # Mark script or synchronization failures
            if [ "$SCRIPT_EXIT" -ne 0 ]; then
              FAILED=1
            fi

            # Append result to environment-specific log
            {
              echo ""
              echo "========================================"
              echo "Backup execution: $START_TIME"
              echo "Environment: $ENV"
              echo "Status: $STATUS"
              echo "$DETAILS"
              echo "========================================"
            } >> "backup-repo/$LOG_FILE"

            echo "$ENV result: $STATUS"

            # Stage log file
            git -C backup-repo add "$LOG_FILE"

          done

          # Commit all environment changes and logs
          cd backup-repo

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --cached --quiet; then

            git commit -m "Coveo environment backups - $(TZ=Asia/Kolkata date +'%Y-%m-%d')"

            git push origin HEAD:coveo-backups

            echo "Backup files and logs pushed successfully."

          else
            echo "No backup or log changes to commit."
          fi

          # Fail workflow if any environment backup failed
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more environment backups failed."
            exit 1
          fi

