# See https://docs.devx.resmed.com/learn/build/vending/sync-repo-to-template/
name: Sync repo with DevX template

on:
  schedule:
    - cron: '* 9 19 * *'
  workflow_dispatch:

jobs:
  tag-workflow:
    uses: resmed/devx-shared-workflows/.github/workflows/tag-workflow-for-datadog-ci.yml@main
    secrets: inherit

  get-devx-updates:
    uses: resmed/devx-shared-workflows/.github/workflows/sync-template.yml@main
    with:
      template-repo: devx-template-python
    secrets: inherit