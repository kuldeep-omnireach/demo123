name: PR Labeler
on:
  pull_request:
    types: [opened]

jobs:
  tag-workflow:
    uses: resmed/devx-shared-workflows/.github/workflows/tag-workflow-for-datadog-ci.yml@main
    secrets: inherit

  pr-labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: rmd-actions/pr-labeler-action@v5
        with:
          configuration-path: .github/pr-labeler.yml # optional, .github/pr-labeler.yml is the default value
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}